<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎀 Pame Store 🎀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Fredoka', 'sans-serif'] },
                    colors: {
                        pame: {
                            pink: '#ffb6c1',
                            darkpink: '#ff6b81',
                            purple: '#cda4ff',
                            mint: '#98ff98',
                            yellow: '#fff4cc'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes resplandor {
            0% { box-shadow: 0 0 10px #98ff98; }
            50% { box-shadow: 0 0 25px #98ff98, 0 0 15px #ffb6c1; }
            100% { box-shadow: 0 0 10px #98ff98; }
        }
        .brillo-magico { animation: resplandor 2s infinite; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fff4cc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #ffb6c1; border-radius: 10px; }
    </style>
</head>
<body class="bg-pame-pink h-screen flex flex-col overflow-hidden" onclick="initAudio(); mantenerFoco()">

    <header class="bg-white text-pame-darkpink p-4 shadow-sm text-center rounded-b-3xl mx-4 mt-2 border-b-4 border-pame-purple relative overflow-hidden">
        <h1 class="text-4xl font-bold tracking-wide flex items-center justify-center gap-3 relative z-10">
            🦄 <span>Pame Store</span> 🎀
        </h1>
    </header>

    <main class="flex-1 flex flex-col md:flex-row p-4 gap-6 overflow-hidden">

        <div class="flex-1 bg-white rounded-[2rem] shadow-lg p-6 flex flex-col border-4 border-white">
            <div class="relative mb-2">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-2xl">🪄</div>
                <input type="text" id="escaner" placeholder="¡Pasa el código o escríbelo aquí!" 
                       class="w-full text-xl pl-12 pr-4 py-4 border-4 border-pame-purple rounded-[1.5rem] focus:outline-none focus:border-pame-darkpink bg-pame-yellow text-gray-700 font-semibold placeholder-gray-400 transition-all focus:shadow-[0_0_15px_rgba(205,164,255,0.5)]" autofocus>
            </div>

            <div id="mensaje" class="text-center h-8 text-pame-darkpink font-bold text-lg transition-all duration-300"></div>

            <div class="flex-1 overflow-y-auto bg-gray-50 rounded-[1.5rem] p-4 border-2 border-gray-100">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b-2 border-pame-mint text-gray-400 text-lg">
                            <th class="py-2 pb-3 font-semibold">Juguete / Dulce</th>
                            <th class="py-2 pb-3 font-semibold text-right">Precio</th>
                        </tr>
                    </thead>
                    <tbody id="lista-carrito"></tbody>
                </table>
                <div id="carrito-vacio" class="text-center text-gray-400 mt-10 text-xl flex flex-col items-center">
                    <span class="text-5xl mb-3 animate-bounce">🛒</span>
                    ¡El carrito está vacío!
                </div>
            </div>
        </div>

        <div class="md:w-1/3 bg-white rounded-[2rem] shadow-lg p-8 flex flex-col justify-between border-4 border-white relative overflow-hidden">
            <div class="absolute -top-10 -right-10 text-8xl opacity-10 pointer-events-none">✨</div>

            <div class="text-center mt-4">
                <h2 class="text-2xl text-gray-400 font-semibold mb-2">Total Mágico</h2>
                <div class="text-6xl font-bold text-pame-darkpink bg-pame-yellow py-6 rounded-[2rem] border-4 border-pame-mint inline-block w-full brillo-magico transition-transform duration-300" id="total-pantalla">
                    $0.00
                </div>
            </div>

            <div id="botones-cobro" class="flex flex-col gap-3 mt-8 z-10">
                <button onclick="cobrar('tarjeta')" class="w-full bg-blue-500 text-white text-2xl font-bold py-4 rounded-[1.5rem] shadow-[0_6px_0_#2563eb] hover:translate-y-1 transition-all active:shadow-none active:translate-y-2 border-2 border-[#2563eb]">💳 Cobrar con Tarjeta</button>
                <button onclick="cobrar('efectivo')" class="w-full bg-pame-mint text-gray-800 text-2xl font-bold py-4 rounded-[1.5rem] shadow-[0_6px_0_#75d675] hover:translate-y-1 transition-all active:shadow-none active:translate-y-2 border-2 border-[#75d675]">💵 Cobrar de Juego</button>
                <button onclick="limpiarCarrito()" class="w-full text-gray-400 font-semibold p-2 hover:bg-gray-100 rounded-[1.5rem] transition-colors text-md mt-2">❌ Empezar de nuevo</button>
            </div>
        </div>
    </main>

    <div id="modal-exito" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full mx-4 text-center transform scale-90 transition-transform duration-300 pop-in border-4 border-pame-pink shadow-[0_0_40px_rgba(255,182,193,0.8)]">
            <div class="text-7xl mb-4 animate-bounce">🎉</div>
            <h2 class="text-4xl font-bold text-pame-darkpink mb-2">¡Venta Exitosa!</h2>
            <p class="text-gray-600 text-xl mb-6 font-medium">Gracias por comprar en Pame Store.</p>
            <div class="text-5xl font-bold text-gray-800 bg-pame-yellow py-4 rounded-xl mb-6 border-4 border-pame-mint" id="modal-total">
                $0.00
            </div>
            <button onclick="cerrarModal()" class="w-full bg-pame-purple text-white text-2xl font-bold py-4 rounded-2xl shadow-[0_6px_0_#a87df0] hover:shadow-[0_3px_0_#a87df0] hover:translate-y-1 transition-all active:shadow-none active:translate-y-2">
                Siguiente Cliente 🌈
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzqcJcyzCJD6hD4DFOayWjgkJqtsmpAS91eHWDVkt4lROi41wCY3uBP4M_H40FJz20HVg/exec"; 
        const APP_TOKEN = "PameStoreSecreto2026"; 

        let carrito = [];
        let total = 0;
        const inputEscaner = document.getElementById('escaner');
        const listaCarrito = document.getElementById('lista-carrito');
        const totalPantalla = document.getElementById('total-pantalla');
        const mensaje = document.getElementById('mensaje');
        const carritoVacio = document.getElementById('carrito-vacio');
        const modalExito = document.getElementById('modal-exito');

        let audioCtx;
        
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        function initAudio() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        }

        function playSonidoEscaneo() {
            try {
                if (audioCtx) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        function hablar(texto) {
            try {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(texto);
                    utterance.lang = 'es-MX';
                    utterance.pitch = 1.6; // Un poco más aguda y tierna
                    utterance.rate = 1.0;
                    
                    const voces = window.speechSynthesis.getVoices();
                    
                    // 1. Filtramos estrictamente las voces que hablen español
                    const vocesEspanol = voces.filter(v => v.lang.startsWith('es'));
                    
                    if (vocesEspanol.length > 0) {
                        // 2. Buscamos las más bonitas DENTRO de las de español
                        const vozDulce = vocesEspanol.find(v => v.name.includes('Paulina') || v.name.includes('Monica') || v.name.includes('Sabina')) || 
                                         vocesEspanol.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('mujer')) || 
                                         vocesEspanol.find(v => v.lang === 'es-MX') || 
                                         vocesEspanol[0]; // Si no hay favoritas, agarramos la primera que sea en español
                        
                        utterance.voice = vozDulce;
                    }

                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {}
        }

        function lanzarConfeti() {
            try {
                var duration = 3000;
                var end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffb6c1', '#ff6b81', '#cda4ff', '#98ff98', '#fff4cc'] });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffb6c1', '#ff6b81', '#cda4ff', '#98ff98', '#fff4cc'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } catch (e) {}
        }

        function celebrarVentaMágica(textoTotal) {
            document.getElementById('modal-total').innerText = textoTotal;
            modalExito.classList.remove('hidden');
            
            lanzarConfeti();
            hablar("¡Venta mágica completada! Gracias por comprar en Pame Store.");
        }

        inputEscaner.addEventListener('keypress', function(e) {
            initAudio(); 
            if (e.key === 'Enter') {
                e.preventDefault();
                const codigo = this.value.trim();
                this.value = ''; 
                if(codigo) buscarProducto(codigo);
            }
        });

        function mantenerFoco() {
            setTimeout(() => {
                if (document.activeElement.tagName !== 'BUTTON') {
                    inputEscaner.focus();
                }
            }, 10);
        }

        async function buscarProducto(codigoEscaneado) {
            mensaje.innerText = "✨ Buscando la magia... ✨";
            mensaje.classList.remove("text-red-500");
            mensaje.classList.add("text-pame-purple");

            try {
                const response = await fetch(`${API_URL}?codigo=${codigoEscaneado}`);
                const data = await response.json();

                if (data.status === 'success') {
                    playSonidoEscaneo(); 
                    agregarAlCarrito(data.codigo, data.producto, parseFloat(data.precio));
                    mensaje.innerText = "";
                } else {
                    mensaje.innerText = "¡Uy! Código no encontrado 🙈";
                    mensaje.classList.add("text-red-500");
                    mensaje.classList.remove("text-pame-purple");
                    setTimeout(() => mensaje.innerText = "", 2000);
                }
            } catch (error) {
                mensaje.innerText = "Error de conexión 📡";
                setTimeout(() => mensaje.innerText = "", 2000);
            }
        }

        function agregarAlCarrito(codigo, nombre, precio) {
            carrito.push({ codigo, nombre, precio });
            total += precio;
            actualizarUI();
        }

        function actualizarUI() {
            listaCarrito.innerHTML = '';

            if (carrito.length === 0) {
                carritoVacio.style.display = 'flex';
            } else {
                carritoVacio.style.display = 'none';

                carrito.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    if (index === carrito.length - 1) {
                        tr.className = "border-b-2 border-gray-100 hover:bg-gray-100 pop-in transition-colors";
                    } else {
                        tr.className = "border-b-2 border-gray-100 hover:bg-gray-100 transition-colors";
                    }

                    tr.innerHTML = `
                        <td class="py-4 text-xl text-gray-700 font-medium pl-2">⭐ ${item.nombre}</td>
                        <td class="py-4 text-2xl font-bold text-pame-darkpink text-right pr-2">$${item.precio.toFixed(2)}</td>
                    `;
                    listaCarrito.appendChild(tr);
                });
            }

            totalPantalla.classList.remove('scale-110');
            void totalPantalla.offsetWidth;
            if(carrito.length > 0) totalPantalla.classList.add('scale-110');
            
            totalPantalla.innerText = `$${total.toFixed(2)}`;
            setTimeout(() => totalPantalla.classList.remove('scale-110'), 300);

            listaCarrito.parentElement.parentElement.scrollTop = listaCarrito.parentElement.parentElement.scrollHeight;
        }

        function limpiarCarrito() {
            carrito = [];
            total = 0;
            actualizarUI();
            mantenerFoco();
        }

        async function cobrar(metodo) {
            initAudio(); 
            if (carrito.length === 0) {
                mensaje.innerText = "¡El carrito está vacío! 🛒";
                setTimeout(() => mensaje.innerText = "", 2000);
                return;
            }

            const divBotones = document.getElementById('botones-cobro');
            divBotones.innerHTML = "<div class='text-xl text-pame-purple font-bold text-center w-full bg-white p-4 rounded-xl shadow'>⏳ Conectando la magia...</div>";

            try {
                const urlActual = window.location.origin + window.location.pathname;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: metodo === 'tarjeta' ? 'pago_tarjeta' : 'pago_efectivo',
                        token: APP_TOKEN,
                        articulos: carrito,
                        dominio: urlActual
                    })
                });

                const data = await response.json();

                if (metodo === 'tarjeta' && data.status === 'success') {
                    window.location.href = data.url;
                } else if (metodo === 'efectivo' && data.status === 'success') {
                    celebrarVentaMágica(`$${total.toFixed(2)}`); 
                    restaurarBotones();
                } else {
                    alert("Acceso denegado o error: " + (data.message || "Desconocido"));
                    restaurarBotones();
                }

            } catch (error) {
                alert("Hubo un error de conexión.");
                restaurarBotones();
            }
        }

        function restaurarBotones() {
            const divBotones = document.getElementById('botones-cobro');
            divBotones.innerHTML = `
                <button onclick="cobrar('tarjeta')" class="w-full bg-blue-500 text-white text-2xl font-bold py-4 rounded-[1.5rem] shadow-[0_6px_0_#2563eb] hover:translate-y-1 transition-all active:shadow-none active:translate-y-2 border-2 border-[#2563eb]">💳 Cobrar con Tarjeta</button>
                <button onclick="cobrar('efectivo')" class="w-full bg-pame-mint text-gray-800 text-2xl font-bold py-4 rounded-[1.5rem] shadow-[0_6px_0_#75d675] hover:translate-y-1 transition-all active:shadow-none active:translate-y-2 border-2 border-[#75d675]">💵 Cobrar de Juego</button>
                <button onclick="limpiarCarrito()" class="w-full text-gray-400 font-semibold p-2 hover:bg-gray-100 rounded-[1.5rem] transition-colors text-md mt-2">❌ Empezar de nuevo</button>
            `;
        }

        function cerrarModal() {
            modalExito.classList.add('hidden');
            limpiarCarrito();
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get("pago") === "exito") {
                celebrarVentaMágica("¡PAGADO CON TARJETA!"); 
            } else if (params.get("pago") === "cancelado") {
                mensaje.innerText = "Pago cancelado por el cliente 😔";
                mensaje.classList.add("text-red-500");
                setTimeout(() => mensaje.innerText = "", 4000);
            }
        };

        actualizarUI();
    </script>
</body>
</html>
